name: Update player review data

on:
  push:
    paths:
      - 'data/**/*.csv'
      - 'data/**/*.xml'
      - 'data/match_overrides.json'
      - 'scripts/generate-matches.js'
      - 'scripts/generate-player-data.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-player-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate match manifest
        run: node scripts/generate-matches.js

      - name: Generate precomputed player data
        run: node scripts/generate-player-data.js

      - name: Commit updated generated data
        run: |
          if git diff --quiet -- data/matches.json data/player_index.json data/stats; then
            echo "Generated data is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json data/player_index.json data/stats
          git commit -m "Update precomputed player review data"
          git push
