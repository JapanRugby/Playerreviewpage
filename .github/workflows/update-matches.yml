name: Update player review data

on:
  push:
    paths:
      - 'data/**/*.csv'
      - 'data/**/*.xml'
      - 'data/match_overrides.json'
      - 'scripts/generate-matches.js'
      - 'scripts/generate-player-data.js'
      - '.github/workflows/update-matches.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-player-review-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate matches manifest
        run: node scripts/generate-matches.js

      - name: Generate player and match review data
        run: node scripts/generate-player-data.js

      - name: Commit generated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          paths=(
            "data/matches.json"
            "data/player_index.json"
            "data/stats"
            "data/match_review"
          )

          for p in "${paths[@]}"; do
            if [ -e "$p" ]; then
              git add "$p"
            fi
          done

          if git diff --cached --quiet; then
            echo "Generated data is already up to date"
            exit 0
          fi

          git commit -m "Update player review data"
          git push
